<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Python Flask API Development — Mastery Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg-primary:#0f172a;--bg-secondary:#f8fafc;--bg-card:#ffffff;
--text-primary:#1e293b;--text-secondary:#64748b;--text-light:#f1f5f9;
--border:#e2e8f0;--border-dark:#cbd5e1;
--beginner:#4CAF50;--beginner-bg:#E8F5E9;--beginner-text:#2E7D32;
--intermediate:#2196F3;--intermediate-bg:#E3F2FD;--intermediate-text:#1565C0;
--advanced:#FF9800;--advanced-bg:#FFF3E0;--advanced-text:#E65100;
--expert:#F44336;--expert-bg:#FFEBEE;--expert-text:#C62828;
--checkpoint-bg:#F3E5F5;--checkpoint-border:#9C27B0;--checkpoint-text:#4A148C;
--milestone-border:#FFC107;
--completed:#10B981;--locked:#94A3B8;
--section1-bg:#F1F8E9;--section1-border:#8BC34A;
--section2-bg:#E8EAF6;--section2-border:#5C6BC0;
--section3-bg:#E0F7FA;--section3-border:#00ACC1;
--section4-bg:#FFF8E1;--section4-border:#FFB300;
--section5-bg:#FCE4EC;--section5-border:#E91E63;
--panel-width:420px;
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg-secondary);color:var(--text-primary);line-height:1.5;overflow-x:hidden}
/* HEADER */
.header{background:var(--bg-primary);color:var(--text-light);padding:16px 24px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header h1{font-size:20px;font-weight:700;white-space:nowrap}
.header .subtitle{font-size:13px;color:var(--text-secondary);margin-left:4px}
.progress-ring{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:14px;font-weight:600;white-space:nowrap}
.progress-ring svg{width:36px;height:36px;transform:rotate(-90deg)}
.progress-ring circle{fill:none;stroke-width:3}
.progress-ring .bg{stroke:#334155}
.progress-ring .fg{stroke:var(--completed);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
/* CONTROLS */
.controls{background:#fff;border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:60px;z-index:99}
.search-box{padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;width:220px;outline:none;font-family:inherit}
.search-box:focus{border-color:var(--intermediate)}
.filter-pills{display:flex;gap:6px}
.pill{padding:4px 12px;border-radius:16px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#fff;transition:all .15s}
.pill:hover{background:var(--bg-secondary)}
.pill.active{color:#fff;border-color:transparent}
.pill[data-diff="all"].active{background:var(--bg-primary)}
.pill[data-diff="beginner"].active{background:var(--beginner)}
.pill[data-diff="intermediate"].active{background:var(--intermediate)}
.pill[data-diff="advanced"].active{background:var(--advanced)}
.pill[data-diff="expert"].active{background:var(--expert)}
/* MAIN */
.main{max-width:1440px;margin:0 auto;padding:24px}
/* SECTION */
.section{margin-bottom:32px;border-radius:12px;overflow:hidden;border:2px solid var(--border)}
.section[data-id="section-1"]{border-color:var(--section1-border)}
.section[data-id="section-2"]{border-color:var(--section2-border)}
.section[data-id="section-3"]{border-color:var(--section3-border)}
.section[data-id="section-4"]{border-color:var(--section4-border)}
.section[data-id="section-5"]{border-color:var(--section5-border)}
.section-header{padding:14px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.section[data-id="section-1"] .section-header{background:var(--section1-bg)}
.section[data-id="section-2"] .section-header{background:var(--section2-bg)}
.section[data-id="section-3"] .section-header{background:var(--section3-bg)}
.section[data-id="section-4"] .section-header{background:var(--section4-bg)}
.section[data-id="section-5"] .section-header{background:var(--section5-bg)}
.section-header h2{font-size:18px;font-weight:600;flex:1}
.section-header .chevron{transition:transform .2s;font-size:18px}
.section-header .chevron.collapsed{transform:rotate(-90deg)}
.section-progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}
.section-progress-bar{width:100px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.section-progress-fill{height:100%;background:var(--completed);border-radius:3px;transition:width .3s}
.section-meta{font-size:12px;color:var(--text-secondary);display:flex;gap:12px}
.section-body{padding:16px 20px;background:#fff}
.section-body.collapsed{display:none}
/* SUB-SECTION */
.subsection{margin-bottom:16px}
.subsection:last-child{margin-bottom:0}
.subsection-title{font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
/* NODE GRID */
.node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
/* NODE CARD */
.node-card{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;border:2px solid var(--border);background:var(--bg-card);cursor:pointer;transition:all .15s;position:relative}
.node-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.node-card.selected{box-shadow:0 0 0 2px var(--intermediate)}
.node-card.locked{opacity:.55;pointer-events:auto}
.node-card.locked::after{content:'🔒';position:absolute;top:4px;right:8px;font-size:11px}
.node-card.done{border-color:var(--completed);background:#f0fdf4}
.node-card.done .node-title{text-decoration:line-through;text-decoration-color:var(--completed)}
/* Difficulty left accent */
.node-card.beginner{border-left:4px solid var(--beginner)}
.node-card.intermediate{border-left:4px solid var(--intermediate)}
.node-card.advanced{border-left:4px solid var(--advanced)}
.node-card.expert{border-left:4px solid var(--expert)}
.node-card.checkpoint{border-left:4px solid var(--checkpoint-border);background:var(--checkpoint-bg);border-color:var(--checkpoint-border)}
.node-card.milestone{border-width:2px 2px 2px 4px}
.node-card.optional{border-style:dashed}
.node-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--border-dark);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer}
.node-check:hover{border-color:var(--completed)}
.node-card.done .node-check{background:var(--completed);border-color:var(--completed);color:#fff}
.node-title{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-badges{display:flex;gap:4px;flex-shrink:0}
.badge{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600;white-space:nowrap}
.badge.beginner{background:var(--beginner-bg);color:var(--beginner-text)}
.badge.intermediate{background:var(--intermediate-bg);color:var(--intermediate-text)}
.badge.advanced{background:var(--advanced-bg);color:var(--advanced-text)}
.badge.expert{background:var(--expert-bg);color:var(--expert-text)}
.badge.milestone-badge{background:#FFF8E1;color:#F57F17}
.badge.hours{background:#F1F5F9;color:var(--text-secondary)}
/* DETAIL PANEL */
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:200}
.overlay.open{display:block}
.detail-panel{position:fixed;top:0;right:-480px;width:var(--panel-width);max-width:100vw;height:100vh;background:#fff;z-index:201;transition:right .25s ease;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12)}
.detail-panel.open{right:0}
.panel-header{padding:20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}
.panel-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-secondary);padding:4px}
.panel-close:hover{color:var(--text-primary)}
.panel-title{font-size:18px;font-weight:700;margin-bottom:6px;padding-right:32px}
.panel-desc{font-size:14px;color:var(--text-secondary);margin-bottom:10px}
.panel-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.panel-badge{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600}
.panel-body{padding:20px}
.panel-section{margin-bottom:20px}
.panel-section h3{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--text-primary)}
.panel-section ul{list-style:none;padding:0}
.panel-section li{font-size:13px;padding:3px 0;color:var(--text-secondary)}
.concept-tag{display:inline-block;padding:2px 8px;background:#F1F5F9;border-radius:6px;font-size:12px;margin:2px}
.prereq-link{color:var(--intermediate);cursor:pointer;text-decoration:underline;font-size:13px}
.prereq-link:hover{color:var(--intermediate-text)}
/* Resources */
.resource-item{padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.resource-title{font-size:13px;font-weight:500}
.resource-title a{color:var(--intermediate);text-decoration:none}
.resource-title a:hover{text-decoration:underline}
.resource-meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.resource-badge{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:500}
.rb-type{background:#EDE7F6;color:#4527A0}
.rb-diff{background:#F1F5F9;color:var(--text-secondary)}
.rb-cost-free{background:#E8F5E9;color:#2E7D32}
.rb-cost-paid{background:#FFF3E0;color:#E65100}
.rb-time{background:#F1F5F9;color:var(--text-secondary)}
.rb-recommended{background:#FFF8E1;color:#F57F17}
.panel-complete-btn{width:100%;padding:10px;border-radius:8px;border:2px solid var(--completed);background:#fff;color:var(--completed);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.panel-complete-btn:hover{background:var(--completed);color:#fff}
.panel-complete-btn.is-done{background:var(--completed);color:#fff}
/* LEGEND */
.legend{max-width:1440px;margin:0 auto 40px;padding:0 24px}
.legend-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;gap:24px;flex-wrap:wrap;font-size:13px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-color{width:16px;height:16px;border-radius:4px;border:2px solid}
/* RESPONSIVE */
@media(max-width:768px){
  .header{flex-direction:column;align-items:flex-start;gap:8px}
  .progress-ring{margin-left:0}
  .controls{flex-direction:column;align-items:stretch}
  .search-box{width:100%}
  .detail-panel{width:100vw}
  .node-grid{grid-template-columns:1fr}
  .section-progress-bar{width:60px}
}
@media print{
  .header,.controls,.overlay,.detail-panel{display:none!important}
  .section-body.collapsed{display:block!important}
  .node-card{break-inside:avoid}
}
</style>
</head>

    <span class="subtitle">Mastery Roadmap — 104 topics · ~310 hours</span>

      <circle class="bg" cx="18" cy="18" r="15.5"/>

<div class="legend">

    <div class="legend-item"><div class="legend-color" style="background:var(--expert-bg);border-color:var(--expert)"></div> Expert</div>

    <div class="legend-item"><span style="font-size:14px">🔒</span> Locked (prereqs incomplete)</div>
    <div class="legend-item"><span style="font-size:14px">✅</span> Completed</div>
  </div>
</div>

<!-- OVERLAY + DETAIL PANEL -->
<div class="overlay" id="overlay"></div>
<div class="detail-panel" id="detailPanel">

    <button class="panel-close" id="panelClose">&times;</button>
    <div class="panel-title" id="panelTitle"></div>
    <div class="panel-desc" id="panelDesc"></div>
    <div class="panel-badges" id="panelBadges"></div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

 "prerequisite"}, {"from": "node-94", "to": "node-100", "type": "prerequisite"}, {"from": "node-9", "to": "checkpoint-1", "type": "prerequisite"}, {"from": "node-18", "to": "checkpoint-1", "type": "prerequisite"}, {"from": "node-20", "to": "checkpoint-1", "type": "prerequisite"}, {"from": "node-24", "to": "checkpoint-2", "type": "prerequisite"}, {"from": "node-26", "to": "checkpoint-2", "type": "prerequisite"}, {"from": "node-27", "to": "checkpoint-2", "type": "prerequisite"}, {"from": "node-36", "to": "checkpoint-3", "type": "prerequisite"}, {"from": "node-47", "to": "checkpoint-3", "type": "prerequisite"}, {"from": "node-54", "to": "checkpoint-3", "type": "prerequisite"}, {"from": "node-67", "to": "checkpoint-3", "type": "prerequisite"}, {"from": "node-80", "to": "checkpoint-4", "type": "prerequisite"}, {"from": "node-84", "to": "checkpoint-4", "type": "prerequisite"}, {"from": "node-73", "to": "checkpoint-4", "type": "prerequisite"}]};

// ========== STATE ==========
const state = {
  completed: new Set(),
  expandedSections: new Set(['section-1','section-2','section-3','section-4','section-5']),
  selectedNode: null,
  filter: 'all',
  searchQuery: ''
};

// Build lookup maps
const nodeMap = {};
ROADMAP_DATA.nodes.forEach(n => nodeMap[n.id] = n);
const sectionMap = {};
ROADMAP_DATA.sections.forEach(s => sectionMap[s.id] = s);

// ========== RENDER ==========
function renderRoadmap() {
  const container = document.getElementById('roadmapContainer');
  container.innerHTML = '';
  ROADMAP_DATA.sections.forEach(section => {
    const sectionEl = document.createElement('div');
    sectionEl.className = 'section';
    sectionEl.dataset.id = section.id;

    const isExpanded = state.expandedSections.has(section.id);
    const sectionNodes = [];
    section.subSections.forEach(sub => sub.nodeIds.forEach(id => { if(nodeMap[id]) sectionNodes.push(nodeMap[id]); }));
    // Add checkpoints
    ROADMAP_DATA.nodes.filter(n => n.isCheckpoint && n.sectionId === section.id).forEach(n => {
      if(!sectionNodes.find(sn => sn.id === n.id)) sectionNodes.push(n);
    });

    const completedInSection = sectionNodes.filter(n => state.completed.has(n.id)).length;
    const totalInSection = sectionNodes.length;

    sectionEl.innerHTML = `
      <div class="section-header" data-section="${section.id}">
        <span class="chevron ${isExpanded?'':'collapsed'}">▼</span>
        <h2>${section.title}</h2>
        <div class="section-meta">
          <span>${section.difficulty}</span>
          <span>~${section.estimatedHours}h</span>
        </div>
        <div class="section-progress">
          <div class="section-progress-bar"><div class="section-progress-fill" style="width:${totalInSection?Math.round(completedInSection/totalInSection*100):0}%"></div></div>
          <span>${completedInSection}/${totalInSection}</span>
        </div>
      </div>
      <div class="section-body ${isExpanded?'':'collapsed'}" id="body-${section.id}"></div>
    `;
    container.appendChild(sectionEl);

    const body = sectionEl.querySelector('.section-body');
    section.subSections.forEach(sub => {
      const subEl = document.createElement('div');
      subEl.className = 'subsection';
      subEl.innerHTML = `<div class="subsection-title">${sub.title}</div><div class="node-grid" id="grid-${sub.id}"></div>`;
      body.appendChild(subEl);

      const grid = subEl.querySelector('.node-grid');
      sub.nodeIds.forEach(nodeId => {
        const node = nodeMap[nodeId];
        if(!node) return;
        if(!matchesFilter(node)) return;
        grid.appendChild(createNodeCard(node));
      });
      // Hide empty subsections
      if(grid.children.length === 0) subEl.style.display = 'none';
    });

    // Checkpoints at bottom
    ROADMAP_DATA.nodes.filter(n => n.isCheckpoint && n.sectionId === section.id).forEach(cpNode => {
      if(!matchesFilter(cpNode)) return;
      const cpGrid = document.createElement('div');
      cpGrid.className = 'node-grid';
      cpGrid.style.marginTop = '12px';
      cpGrid.appendChild(createNodeCard(cpNode));
      body.appendChild(cpGrid);
    });

    // Section header click
    sectionEl.querySelector('.section-header').addEventListener('click', () => {
      if(state.expandedSections.has(section.id)) state.expandedSections.delete(section.id);
      else state.expandedSections.add(section.id);
      renderRoadmap();
    });
  });
}

function matchesFilter(node) {
  if(state.filter !== 'all' && node.difficulty !== state.filter) return false;
  if(state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    return node.title.toLowerCase().includes(q) || (node.description||'').toLowerCase().includes(q) || (node.keyConcepts||[]).some(c => c.toLowerCase().includes(q));
  }
  return true;
}

function createNodeCard(node) {
  const card = document.createElement('div');
  const isDone = state.completed.has(node.id);
  const isLocked = !isDone && !checkPrereqs(node.id);
  let cls = 'node-card ' + node.difficulty;
  if(node.isCheckpoint) cls = 'node-card checkpoint';
  if(node.isMilestone) cls += ' milestone';
  if(node.isOptional) cls += ' optional';
  if(isDone) cls += ' done';
  if(isLocked) cls += ' locked';
  if(state.selectedNode === node.id) cls += ' selected';
  card.className = cls;
  card.dataset.nodeId = node.id;

  const checkIcon = isDone ? '✓' : '';
  let badges = '';
  if(node.isMilestone) badges += '<span class="badge milestone-badge">🏆</span>';
  if(node.estimatedHours > 0) badges += `<span class="badge hours">${node.estimatedHours}h</span>`;

  card.innerHTML = `
    <div class="node-check" data-check="${node.id}">${checkIcon}</div>
    <span class="node-title" title="${escHtml(node.title)}">${escHtml(node.title)}</span>
    <div class="node-badges">${badges}</div>
  `;

  card.querySelector('.node-check').addEventListener('click', e => {
    e.stopPropagation();
    toggleComplete(node.id);
  });
  card.addEventListener('click', () => openDetailPanel(node.id));
  return card;
}

function checkPrereqs(nodeId) {
  const node = nodeMap[nodeId];
  if(!node || !node.prerequisites || node.prerequisites.length === 0) return true;
  return node.prerequisites.every(pid => state.completed.has(pid));
}

function toggleComplete(nodeId) {
  if(state.completed.has(nodeId)) state.completed.delete(nodeId);
  else state.completed.add(nodeId);
  updateProgress();
  renderRoadmap();
  if(state.selectedNode) refreshPanel();
}

function updateProgress() {
  const total = ROADMAP_DATA.nodes.length;
  const done = state.completed.size;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressText').textContent = pct + '% Complete';
  const circle = document.getElementById('progressCircle');
  const circumference = 97.4;
  circle.setAttribute('stroke-dashoffset', circumference - (circumference * pct / 100));
}

// ========== DETAIL PANEL ==========
function openDetailPanel(nodeId) {
  state.selectedNode = nodeId;
  refreshPanel();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
  renderRoadmap();
}

function refreshPanel() {
  const node = nodeMap[state.selectedNode];
  if(!node) return;
  document.getElementById('panelTitle').textContent = node.title;
  document.getElementById('panelDesc').textContent = node.description || '';

  let badgesHtml = `<span class="panel-badge badge ${node.difficulty}">${node.difficulty}</span>`;
  if(node.isMilestone) badgesHtml += '<span class="panel-badge badge milestone-badge">🏆 Milestone</span>';
  if(node.isCheckpoint) badgesHtml += '<span class="panel-badge" style="background:var(--checkpoint-bg);color:var(--checkpoint-text)">✓ Checkpoint</span>';
  if(node.isOptional) badgesHtml += '<span class="panel-badge" style="background:#F1F5F9;color:var(--text-secondary)">Optional</span>';
  if(node.estimatedHours > 0) badgesHtml += `<span class="panel-badge badge hours">${node.estimatedHours} hours</span>`;
  document.getElementById('panelBadges').innerHTML = badgesHtml;

  let bodyHtml = '';

  // Prerequisites
  if(node.prerequisites && node.prerequisites.length > 0) {
    bodyHtml += '<div class="panel-section"><h3>Prerequisites</h3><ul>';
    node.prerequisites.forEach(pid => {
      const pn = nodeMap[pid];
      const done = state.completed.has(pid);
      bodyHtml += `<li>${done?'✅':'⬜'} <span class="prereq-link" data-goto="${pid}">${pn?escHtml(pn.title):pid}</span></li>`;
    });
    bodyHtml += '</ul></div>';
  }

  // Key concepts
  if(node.keyConcepts && node.keyConcepts.length > 0) {
    bodyHtml += '<div class="panel-section"><h3>Key Concepts</h3><div>';
    node.keyConcepts.forEach(c => bodyHtml += `<span class="concept-tag">${escHtml(c)}</span>`);
    bodyHtml += '</div></div>';
  }

  // Sub-topics
  if(node.subTopics && node.subTopics.length > 0) {
    bodyHtml += '<div class="panel-section"><h3>Sub-topics</h3><ul>';
    node.subTopics.forEach(t => bodyHtml += `<li>• ${escHtml(t)}</li>`);
    bodyHtml += '</ul></div>';
  }

  // Resources
  if(node.resources && node.resources.length > 0) {
    bodyHtml += '<div class="panel-section"><h3>Resources (' + node.resources.length + ')</h3>';
    // Sort recommended first
    const sorted = [...node.resources].sort((a,b) => (b.isRecommended?1:0) - (a.isRecommended?1:0));
    sorted.forEach(r => {
      bodyHtml += `<div class="resource-item">
        <div class="resource-title">${r.isRecommended?'⭐ ':''}<a href="${escHtml(r.url)}" target="_blank" rel="noopener">${escHtml(r.title)}</a></div>
        <div class="resource-meta">
          <span class="resource-badge rb-type">${escHtml(r.type)}</span>
          <span class="resource-badge rb-diff">${escHtml(r.difficulty)}</span>
          <span class="resource-badge ${r.cost==='free'?'rb-cost-free':'rb-cost-paid'}">${r.cost}</span>
          ${r.estimatedTime?`<span class="resource-badge rb-time">${escHtml(r.estimatedTime)}</span>`:''}
        </div>
      </div>`;
    });
    bodyHtml += '</div>';
  }

  // Complete button
  const isDone = state.completed.has(node.id);
  bodyHtml += `<button class="panel-complete-btn ${isDone?'is-done':''}" id="panelCompleteBtn">${isDone?'✓ Completed — Click to Undo':'Mark as Complete'}</button>`;

  document.getElementById('panelBody').innerHTML = bodyHtml;

  // Wire prereq links
  document.querySelectorAll('.prereq-link[data-goto]').forEach(el => {
    el.addEventListener('click', () => {
      const targetId = el.dataset.goto;
      closeDetailPanel();
      setTimeout(() => scrollToNode(targetId), 300);
    });
  });

  // Wire complete button
  document.getElementById('panelCompleteBtn').addEventListener('click', () => toggleComplete(node.id));
}

function closeDetailPanel() {
  state.selectedNode = null;
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
  renderRoadmap();
}

function scrollToNode(nodeId) {
  const el = document.querySelector(`[data-node-id="${nodeId}"]`);
  if(el) {
    // Ensure parent section is expanded
    const node = nodeMap[nodeId];
    if(node) state.expandedSections.add(node.sectionId);
    renderRoadmap();
    setTimeout(() => {
      const el2 = document.querySelector(`[data-node-id="${nodeId}"]`);
      if(el2) {
        el2.scrollIntoView({behavior:'smooth',block:'center'});
        el2.style.boxShadow = '0 0 0 3px var(--intermediate)';
        setTimeout(() => el2.style.boxShadow = '', 2000);
      }
    }, 100);
  }
}

function escHtml(s) {
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========== EVENT LISTENERS ==========
document.getElementById('overlay').addEventListener('click', closeDetailPanel);
document.getElementById('panelClose').addEventListener('click', closeDetailPanel);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDetailPanel(); });

document.getElementById('searchBox').addEventListener('input', e => {
  state.searchQuery = e.target.value;
  renderRoadmap();
});

document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    state.filter = pill.dataset.diff;
    renderRoadmap();
  });
});

// ========== INIT ==========
renderRoadmap();
updateProgress();
</script>
