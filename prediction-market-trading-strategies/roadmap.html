<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction Market Trading Strategies Mastery Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --card: #161b22; --node-bg: #21262d;
  --text: #f0f6fc; --text-sec: #8b949e; --border: #30363d;
  --green: #4CAF50; --blue: #2196F3; --orange: #FF9800; --red: #F44336;
  --gold: #FFD700; --purple: #9C27B0; --glow: rgba(56,139,253,0.4);
}
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Header */
.header { background: linear-gradient(135deg, #161b22 0%, #1a2332 100%); border-bottom: 1px solid var(--border); padding: 20px 24px; position: sticky; top: 0; z-index: 100; }
.header-inner { max-width: 1600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 1.4rem; font-weight: 700; }
.header h1 span { color: var(--text-sec); font-weight: 400; font-size: 0.9rem; margin-left: 8px; }
.progress-bar-outer { width: 200px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-bar-inner { height: 100%; background: var(--green); border-radius: 4px; transition: width 0.3s; }
.progress-text { font-size: 0.85rem; color: var(--text-sec); min-width: 40px; text-align: right; }
.header-progress { display: flex; align-items: center; gap: 10px; }

/* Controls */
.controls { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; position: sticky; top: 70px; z-index: 99; }
.controls-inner { max-width: 1600px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.search-box { background: var(--node-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; width: 220px; }
.search-box:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px var(--glow); }
.filter-btn { background: var(--node-bg); border: 1px solid var(--border); color: var(--text-sec); padding: 4px 12px; border-radius: 14px; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; }
.filter-btn:hover, .filter-btn.active { border-color: currentColor; }
.filter-btn.active { color: var(--text); }
.filter-btn[data-level="beginner"].active { color: var(--green); border-color: var(--green); }
.filter-btn[data-level="intermediate"].active { color: var(--blue); border-color: var(--blue); }
.filter-btn[data-level="advanced"].active { color: var(--orange); border-color: var(--orange); }
.filter-btn[data-level="expert"].active { color: var(--red); border-color: var(--red); }

/* Legend */
.legend { display: flex; gap: 16px; margin-left: auto; font-size: 0.75rem; color: var(--text-sec); align-items: center; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; }

/* Main */
.main { max-width: 1600px; margin: 0 auto; padding: 24px; }

/* Sections */
.section { margin-bottom: 32px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.section-header { padding: 16px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; transition: background 0.2s; }
.section-header:hover { filter: brightness(1.1); }
.section-header h2 { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.section-header .chevron { transition: transform 0.3s; font-size: 0.8rem; }
.section-header.collapsed .chevron { transform: rotate(-90deg); }
.section-meta { display: flex; align-items: center; gap: 16px; font-size: 0.8rem; color: var(--text-sec); }
.section-progress { width: 120px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.section-progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.section-body { padding: 20px; transition: max-height 0.3s ease; overflow: hidden; }
.section-body.collapsed { max-height: 0 !important; padding: 0 20px; }

/* Domain columns */
.domain-grid { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.domain-col { flex: 1; min-width: 240px; max-width: 300px; }
.domain-title { font-size: 0.8rem; font-weight: 600; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 0; border-bottom: 1px solid var(--border); margin-bottom: 10px; }

/* Nodes */
.node { background: var(--node-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; position: relative; overflow: hidden; }
.node::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 8px 0 0 8px; }
.node[data-diff="beginner"]::before { background: var(--green); }
.node[data-diff="intermediate"]::before { background: var(--blue); }
.node[data-diff="advanced"]::before { background: var(--orange); }
.node[data-diff="expert"]::before { background: var(--red); }
.node:hover { border-color: #484f58; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.node.completed { opacity: 0.7; }
.node.completed .node-title { text-decoration: line-through; color: var(--text-sec); }
.node.locked { opacity: 0.45; }
.node.locked::after { content: '🔒'; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 0.7rem; }
.node.recommended { border-color: var(--purple); border-width: 2px; }
.node.milestone { border-color: var(--gold); border-width: 2px; }
.node.optional { border-style: dashed; }
.node.hidden { display: none; }
.node-check { width: 16px; height: 16px; border: 2px solid var(--border); border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; cursor: pointer; transition: all 0.2s; }
.node-check.checked { background: var(--green); border-color: var(--green); color: #fff; }
.node-title { font-size: 0.82rem; font-weight: 500; line-height: 1.3; flex: 1; }
.node-hours { font-size: 0.7rem; color: var(--text-sec); flex-shrink: 0; }
.node.checkpoint { background: linear-gradient(135deg, #332b00, #1a1500); border-color: var(--gold); text-align: center; justify-content: center; }
.node.checkpoint .node-title { color: var(--gold); font-weight: 600; }

/* Detail Panel */
.panel-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.panel-overlay.open { opacity: 1; pointer-events: auto; }
.detail-panel { position: fixed; top: 0; right: -440px; width: 420px; max-width: 90vw; height: 100vh; background: var(--card); border-left: 1px solid var(--border); z-index: 201; overflow-y: auto; transition: right 0.3s ease; padding: 24px; }
.detail-panel.open { right: 0; }
.panel-close { position: absolute; top: 16px; right: 16px; background: var(--node-bg); border: 1px solid var(--border); color: var(--text); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
.panel-close:hover { background: var(--border); }
.panel-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; padding-right: 40px; }
.panel-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.badge { padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
.badge-beginner { background: rgba(76,175,80,0.2); color: var(--green); }
.badge-intermediate { background: rgba(33,150,243,0.2); color: var(--blue); }
.badge-advanced { background: rgba(255,152,0,0.2); color: var(--orange); }
.badge-expert { background: rgba(244,67,54,0.2); color: var(--red); }
.badge-free { background: rgba(76,175,80,0.15); color: var(--green); }
.badge-paid { background: rgba(255,152,0,0.15); color: var(--orange); }
.panel-section { margin-bottom: 20px; }
.panel-section h3 { font-size: 0.8rem; font-weight: 600; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.panel-desc { color: var(--text-sec); font-size: 0.9rem; }
.concept-list { list-style: none; }
.concept-list li { padding: 3px 0; font-size: 0.85rem; color: var(--text-sec); }
.concept-list li::before { content: '•'; color: var(--blue); margin-right: 8px; }
.resource-item { background: var(--node-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; }
.resource-item a { font-size: 0.85rem; font-weight: 500; }
.resource-meta { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.resource-meta .badge { font-size: 0.65rem; }
.prereq-link { display: inline-block; background: var(--node-bg); border: 1px solid var(--border); padding: 2px 10px; border-radius: 12px; font-size: 0.78rem; margin: 2px; cursor: pointer; transition: border-color 0.2s; }
.prereq-link:hover { border-color: var(--blue); }

/* Print */
@media print {
  .header, .controls, .panel-overlay, .detail-panel { display: none; }
  .section-body.collapsed { max-height: none !important; padding: 20px; }
  .node { break-inside: avoid; }
}

/* Responsive */
@media (max-width: 768px) {
  .header-inner { flex-direction: column; align-items: flex-start; }
  .controls-inner { flex-direction: column; align-items: stretch; }
  .search-box { width: 100%; }
  .legend { margin-left: 0; }
  .domain-col { min-width: 100%; }
  .detail-panel { width: 100vw; max-width: 100vw; }
}
</style>

rningPaths":[{"id":"quick-start","title":"Quick Start","estimatedHours":150,"description":"Minimum viable path: probability basics, platform mechanics, basic pricing, risk management","nodeIds":["1.1","1.3","1.4","1.5","1.6","1.7","2.1","2.4","2.9","2.11","2.13","3.1","3.2","3.6","4.1","4.5","5.1","5.2","5.12","6.6","7.1","7.2","7.3","7.5","7.6"]},{"id":"standard","title":"Standard","estimatedHours":400,"description":"Full foundations + core methods + intro to advanced strategies"},{"id":"comprehensive","title":"Comprehensive","estimatedHours":750,"description":"All sections through advanced, selective expert topics"},{"id":"expert","title":"Expert (Full Mastery)","estimatedHours":1003,"description":"Complete all 150 nodes across all 15 domains"}],"progressTracking":{"storage":"localStorage","features":{"nodeCheckbox":{"type":"checkbox","states":["not-started","in-progress","complete"]},"sectionProgress":{"type":"progress-bar","display":"X of Y complete (Z%)"},"overallProgress":{"type":"percentage","display":"header-bar"},"prerequisiteLocking":{"enabled":true,"visualStyle":"opacity-50-with-lock-icon"}}},"resourcePanel":{"position":"right-sidebar","width":400,"sections":["description","key-concepts","resources","prerequisites","next-steps"],"resourceSorting":["recommended","video","course","book","tool","repository","article","paper","documentation"],"badges":["difficulty","format","cost","estimatedTime"]},"checkpoints":["cp-1","cp-2","cp-3","cp-4"]};

// State
const completed = new Set();
let activeFilter = 'all';
let searchQuery = '';

// Domain name formatter
function domainName(id) {
  return id.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

// Difficulty badge class
function diffBadge(d) { return 'badge badge-' + d; }

// Get type emoji
function typeEmoji(t) {
  const m = {video:'📹',course:'🎓',book:'📖',exercise:'🔧',doc:'📄',podcast:'🎙️',repo:'💻',tool:'🔧',article:'📰'};
  return m[t] || '📎';
}

// Build the roadmap HTML
function render() {
  const container = document.getElementById('roadmap');
  let html = '';

  for (const section of ROADMAP.sections) {
    const sectionNodes = ROADMAP.nodes.filter(n => n.sectionId === section.id);
    const contentNodes = sectionNodes.filter(n => !n.isCheckpoint);
    const completedInSection = contentNodes.filter(n => completed.has(n.id)).length;
    const pct = contentNodes.length ? Math.round(completedInSection / contentNodes.length * 100) : 0;

    // Group by domain
    const domains = {};
    for (const dl of section.domainLayouts) {
      domains[dl.domainId] = [];
    }
    for (const n of sectionNodes) {
      if (n.isCheckpoint) continue;
      if (!domains[n.domain]) domains[n.domain] = [];
      domains[n.domain].push(n);
    }
    // Sort each domain by displayOrder
    for (const d in domains) domains[d].sort((a, b) => a.displayOrder - b.displayOrder);

    const checkpoint = sectionNodes.find(n => n.isCheckpoint);

    html += '<div class="section" data-section="' + section.id + '">';
    html += '<div class="section-header" style="background:' + section.color + '22" onclick="toggleSection(this)">';
    html += '<h2><span class="chevron">▼</span> ' + section.title + ' <span style="font-weight:400;font-size:0.85rem;color:var(--text-sec)">' + section.description.split('.')[0] + '</span></h2>';
    html += '<div class="section-meta"><span>' + completedInSection + '/' + contentNodes.length + '</span>';
    html += '<div class="section-progress"><div class="section-progress-fill" style="width:' + pct + '%;background:' + section.color + '"></div></div>';
    html += '<span>' + pct + '%</span><span>' + section.estimatedHours + 'h</span></div></div>';

    html += '<div class="section-body"><div class="domain-grid">';

    for (const dl of section.domainLayouts) {
      const nodes = domains[dl.domainId] || [];
      html += '<div class="domain-col"><div class="domain-title">' + domainName(dl.domainId) + '</div>';
      for (const n of nodes) {
        const isCompleted = completed.has(n.id);
        const prereqsMet = n.prerequisites.every(p => completed.has(p));
        const isLocked = n.prerequisites.length > 0 && !prereqsMet;
        const matchesFilter = activeFilter === 'all' || n.difficulty === activeFilter;
        const matchesSearch = !searchQuery || n.title.toLowerCase().includes(searchQuery);
        const classes = ['node'];
        if (isCompleted) classes.push('completed');
        if (isLocked && !isCompleted) classes.push('locked');
        if (n.isRecommended) classes.push('recommended');
        if (n.isMilestone) classes.push('milestone');
        if (n.isOptional) classes.push('optional');
        if (!matchesFilter || !matchesSearch) classes.push('hidden');

        html += '<div class="' + classes.join(' ') + '" data-id="' + n.id + '" data-diff="' + n.difficulty + '" onclick="openPanel(\'' + n.id + '\')">';
        html += '<div class="node-check' + (isCompleted ? ' checked' : '') + '" onclick="event.stopPropagation();toggleNode(\'' + n.id + '\')">' + (isCompleted ? '✓' : '') + '</div>';
        html += '<div class="node-title">' + n.title + '</div>';
        if (n.estimatedHours) html += '<div class="node-hours">' + n.estimatedHours + 'h</div>';
        html += '</div>';
      }
      html += '</div>';
    }

    html += '</div>';

    // Checkpoint
    if (checkpoint) {
      const cpDone = contentNodes.length > 0 && contentNodes.every(n => completed.has(n.id));
      html += '<div class="node checkpoint' + (cpDone ? ' completed' : '') + '" data-id="' + checkpoint.id + '" style="margin:16px auto 0;max-width:400px;">';
      html += '<div class="node-title">' + checkpoint.title + '</div></div>';
    }

    html += '</div></div>';
  }

  container.innerHTML = html;
  updateProgress();
}

function toggleNode(id) {
  if (completed.has(id)) completed.delete(id);
  else completed.add(id);
  render();
}

function toggleSection(el) {
  el.classList.toggle('collapsed');
  const body = el.nextElementSibling;
  body.classList.toggle('collapsed');
}

function updateProgress() {
  const contentNodes = ROADMAP.nodes.filter(n => !n.isCheckpoint);
  const done = contentNodes.filter(n => completed.has(n.id)).length;
  const pct = contentNodes.length ? Math.round(done / contentNodes.length * 100) : 0;
  document.getElementById('overall-bar').style.width = pct + '%';
  document.getElementById('overall-pct').textContent = pct + '%';
}

function openPanel(id) {
  const node = ROADMAP.nodes.find(n => n.id === id);
  if (!node || node.isCheckpoint) return;
  const panel = document.getElementById('detail-panel');
  const content = document.getElementById('panel-content');

  let h = '<div class="panel-title">' + node.title + '</div>';
  h += '<div class="panel-badges">';
  h += '<span class="' + diffBadge(node.difficulty) + '">' + node.difficulty + '</span>';
  h += '<span class="badge" style="background:var(--node-bg);color:var(--text-sec)">' + domainName(node.domain) + '</span>';
  if (node.estimatedHours) h += '<span class="badge" style="background:var(--node-bg);color:var(--text-sec)">' + node.estimatedHours + 'h</span>';
  if (node.isRecommended) h += '<span class="badge" style="background:rgba(156,39,176,0.2);color:var(--purple)">Recommended</span>';
  if (node.isMilestone) h += '<span class="badge" style="background:rgba(255,215,0,0.2);color:var(--gold)">Milestone</span>';
  h += '</div>';

  if (node.description) {
    h += '<div class="panel-section"><h3>Description</h3><p class="panel-desc">' + node.description + '</p></div>';
  }

  if (node.keyConcepts && node.keyConcepts.length) {
    h += '<div class="panel-section"><h3>Key Concepts</h3><ul class="concept-list">';
    for (const c of node.keyConcepts) h += '<li>' + c + '</li>';
    h += '</ul></div>';
  }

  if (node.resources && node.resources.length) {
    h += '<div class="panel-section"><h3>Resources (' + node.resources.length + ')</h3>';
    for (const r of node.resources) {
      h += '<div class="resource-item">';
      h += '<a href="' + r.url + '" target="_blank" rel="noopener">' + typeEmoji(r.type) + ' ' + r.title + '</a>';
      h += '<div class="resource-meta">';
      h += '<span class="badge badge-' + (r.difficulty || node.difficulty) + '">' + (r.difficulty || node.difficulty) + '</span>';
      h += '<span class="badge badge-' + (r.cost === 'free' ? 'free' : 'paid') + '">' + (r.cost || 'free') + '</span>';
      if (r.type) h += '<span class="badge" style="background:var(--node-bg);color:var(--text-sec)">' + r.type + '</span>';
      if (r.isRecommended) h += '<span class="badge" style="background:rgba(156,39,176,0.2);color:var(--purple)">★</span>';
      h += '</div></div>';
    }
    h += '</div>';
  }

  if (node.prerequisites && node.prerequisites.length) {
    h += '<div class="panel-section"><h3>Prerequisites</h3>';
    for (const p of node.prerequisites) {
      const pn = ROADMAP.nodes.find(n => n.id === p);
      if (pn) h += '<span class="prereq-link" onclick="scrollToNode(\'' + p + '\')">' + '← ' + pn.title + '</span>';
    }
    h += '</div>';
  }

  // Next steps (nodes that have this as prerequisite)
  const nextNodes = ROADMAP.nodes.filter(n => n.prerequisites && n.prerequisites.includes(id));
  if (nextNodes.length) {
    h += '<div class="panel-section"><h3>Next Steps</h3>';
    for (const nn of nextNodes) {
      h += '<span class="prereq-link" onclick="scrollToNode(\'' + nn.id + '\')">' + '→ ' + nn.title + '</span>';
    }
    h += '</div>';
  }

  content.innerHTML = h;
  panel.classList.add('open');
  document.getElementById('panel-overlay').classList.add('open');
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('panel-overlay').classList.remove('open');
}

function scrollToNode(id) {
  closePanel();
  setTimeout(() => {
    const el = document.querySelector('[data-id="' + id + '"]');
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.boxShadow = '0 0 0 3px var(--blue)';
      setTimeout(() => el.style.boxShadow = '', 1500);
    }
  }, 350);
}

// Search
document.getElementById('search').addEventListener('input', function(e) {
  searchQuery = e.target.value.toLowerCase();
  render();
});

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeFilter = this.dataset.level;
    render();
  });
});

// Panel close
document.getElementById('panel-close').addEventListener('click', closePanel);
document.getElementById('panel-overlay').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// Initial render
render();
</script>
